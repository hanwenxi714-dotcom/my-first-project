<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xixi's Night Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed canvas sky with a small caption panel pinned bottom-left. Single dark theme by choice. */
:root {
  --sky-top: #0b1026;
  --sky-low: #1c2350;
  --star: #fff6dc;
  --line: rgba(255, 246, 220, 0.35);
  --ink: #e9e6f5;
  --muted: #9a9cc4;
  --glow: #ffcf7a;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky-top);
  color: var(--ink);
  font-family: var(--display);
  overflow: hidden;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.panel {
  position: fixed;
  left: 16px; right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: 30rem;
  display: grid;
  gap: 0.6rem;
  pointer-events: none;
}
h1 {
  margin: 0;
  font-size: clamp(2.2rem, 7vw, 4rem);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
h1 span { color: var(--glow); }
p { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.5; max-width: 60ch; }
.meta {
  display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem;
  font-family: var(--mono); font-size: 0.8rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  font-variant-numeric: tabular-nums;
}
.meta b { color: var(--ink); font-weight: 500; }
.actions { display: flex; gap: 0.5rem; pointer-events: auto; }
button {
  font: 500 0.85rem var(--mono);
  color: var(--ink);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.45rem 0.9rem;
  cursor: pointer;
}
button:hover { background: rgba(255, 255, 255, 0.12); }
button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
</style>
</head>
<body>

<canvas id="sky" aria-label="Night sky. Click to place stars that join into a constellation."></canvas>

<div class="panel">
  <h1>Hello, <span>Xixi</span>.</h1>
  <p>This is your first project. Tap anywhere on the sky to place a star, and each new star joins your constellation.</p>
  <div class="meta">
    <span>Singapore <b id="clock">--:--:--</b></span>
    <span>Stars <b id="count">0</b></span>
  </div>
  <div class="actions">
    <button id="clear" type="button">Clear constellation</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const countEl = document.getElementById('count');
  const clockEl = document.getElementById('clock');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, dpr, bg = [], mine = [];

  function resize() {
    dpr = window.devicePixelRatio || 1;
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round((w * h) / 4000);
    bg = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.2 + 0.2, p: Math.random() * Math.PI * 2
    }));
  }

  // Start with a small example constellation so the sky isn't empty.
  function seed() {
    const pts = [[0.62, 0.18], [0.70, 0.24], [0.78, 0.22], [0.84, 0.30], [0.80, 0.40]];
    mine = pts.map(([x, y]) => ({ x: x * w, y: y * h, born: -1e9 }));
    countEl.textContent = mine.length;
  }

  function draw(t) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#0b1026'); g.addColorStop(1, '#1c2350');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    for (const s of bg) {
      const a = reduced ? 0.7 : 0.45 + 0.4 * Math.sin(t / 900 + s.p);
      ctx.fillStyle = `rgba(255,246,220,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }

    if (mine.length > 1) {
      ctx.strokeStyle = 'rgba(255,246,220,0.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(mine[0].x, mine[0].y);
      for (const p of mine.slice(1)) ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    for (const p of mine) {
      const age = Math.min(1, (t - p.born) / 600);
      const r = 2.5 + (reduced ? 0 : (1 - age) * 6);
      const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 14);
      halo.addColorStop(0, 'rgba(255,207,122,0.55)'); halo.addColorStop(1, 'rgba(255,207,122,0)');
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#fff6dc'; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  function tick() {
    try {
      clockEl.textContent = new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Singapore' });
    } catch (e) { clockEl.textContent = new Date().toLocaleTimeString(); }
  }

  canvas.addEventListener('click', e => {
    mine.push({ x: e.clientX, y: e.clientY, born: performance.now() });
    countEl.textContent = mine.length;
  });
  document.getElementById('clear').addEventListener('click', () => {
    mine = []; countEl.textContent = 0;
  });
  window.addEventListener('resize', resize);

  resize(); seed(); tick(); setInterval(tick, 1000);
  requestAnimationFrame(draw);
})();
</script>

</body>
</html>
